<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <rect width="720" height="520" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">FIG. 4 - BLE-MIDI control plane and SysEx upload</text>
  <rect x="40" y="50" width="300" height="200" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="55" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold">400 Inbound BLE-MIDI</text>
  <rect x="55" y="85" width="270" height="40" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="190" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">402</text>
  <text x="190" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">0x80-0xBF performance MIDI to UART</text>
  <rect x="55" y="132" width="270" height="50" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="190" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">404</text>
  <text x="190" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">0xFE + opcode + data</text>
  <text x="190" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">handleMessage(code, data)</text>
  <rect x="55" y="190" width="270" height="50" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="190" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">406</text>
  <text x="190" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">0xF0..0xF7 SysEx accumulate</text>
  <text x="190" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">MIDI upload + settings JSON</text>
  <rect x="380" y="50" width="300" height="200" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="395" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold">410 Outbound telemetry</text>
  <rect x="395" y="85" width="270" height="35" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="530" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">412 0x57 major, 0x58 minor, 0x59 patch</text>
  <rect x="395" y="128" width="270" height="35" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="530" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">414 settings snapshot SysEx on connect</text>
  <rect x="395" y="171" width="270" height="70" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="530" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">416 Sample opcodes</text>
  <text x="530" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">0x16 instrument  0x35 chords  0x5C WiFi OTA</text>
  <text x="530" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">0x52 rec/play  0x53 MIDI slot  0x57 strum-step</text>
  <rect x="40" y="270" width="640" height="100" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="55" y="292" font-family="Arial, sans-serif" font-size="11" font-weight="bold">420 SysEx MIDI upload (0x7D 0x4D 0x49)</text>
  <rect x="55" y="305" width="190" height="50" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="150" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">422 BEGIN 0x01</text>
  <text x="150" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">slot 1-10, 7-bit size, malloc</text>
  <rect x="265" y="305" width="190" height="50" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="360" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">424 DATA 0x02</text>
  <text x="360" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">base64 chunk decode append</text>
  <rect x="475" y="305" width="190" height="50" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="570" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">426 END 0x03</text>
  <text x="570" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">write /spiffs/N.mid</text>
  <rect x="40" y="390" width="640" height="75" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="55" y="412" font-family="Arial, sans-serif" font-size="11" font-weight="bold">430</text>
  <text x="360" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">After upload: diji_refresh_parsed_midi_if_path_matches()</text>
  <text x="360" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">re-parse for strum-step (events) or sequencer (stream/timed)</text>
  <text x="360" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Static b64 decode buffer avoids heap fragmentation on long BLE transfers</text>
  <text x="360" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">FIG. 4</text>
</svg>
