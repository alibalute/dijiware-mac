  <text x="360" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">WebServer.cpp: GET /, GET /api/debug, POST /api/update, POST /api/storage</text>
  <text x="360" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">CORS headers (http_ota_cors.h) for browser / WebView uploads</text>
