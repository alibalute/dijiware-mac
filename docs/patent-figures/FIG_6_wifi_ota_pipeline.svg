  <text x="190" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">612 accumulate multipart headers</text>
  <text x="190" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">614 findFirmwareStartInBuffer</text>
  <text x="190" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">616 esp_ota_write 128-byte chunks</text>
  <text x="190" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">618 avoid interrupt WDT reset</text>
