<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>
  <rect width="720" height="500" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">FIG. 2 - FreeRTOS task architecture</text>
  <rect x="40" y="55" width="640" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="55" y="78" font-family="Arial, sans-serif" font-size="11" font-weight="bold">200</text>
  <text x="360" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">xADCSemaphore - serializes ADC/SPI access</text>
  <text x="360" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Strum calibrate MUST run in eTarTask only (not BLE/USB callbacks)</text>
  <rect x="40" y="130" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">202 eTarTask</text>
  <text x="140" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">priority 12</text>
  <text x="140" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">strum + fret loop</text>
  <rect x="260" y="130" width="200" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">204 task_ble_midi</text>
  <text x="360" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">blemidi_tick</text>
  <text x="360" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">FW version on connect</text>
  <rect x="480" y="130" width="200" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="580" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">206 xWifiTask</text>
  <text x="580" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">priority 6</text>
  <text x="580" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">AP + WebServer</text>
  <rect x="40" y="220" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="140" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">208 xButtonsTask</text>
  <text x="140" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">power, calibrate trigger</text>
  <rect x="260" y="220" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="360" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">210 midi_sequencer</text>
  <text x="360" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">timed playback (blocked in strum-step)</text>
  <rect x="480" y="220" width="200" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="580" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">212 Bluedroid BLE</text>
  <text x="580" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">priority ~19 (above eTar)</text>
  <rect x="100" y="310" width="520" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="115" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="bold">214</text>
  <text x="360" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Deferred strum calibration path</text>
  <text x="360" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">BLE/USB: util_schedule_strum_calibrate() sets atomic flag</text>
  <text x="360" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">eTarTask: util_run_pending_strum_calibrate_from_etar() runs strumCalibrate()</text>
  <line x1="360" y1="200" x2="360" y2="220" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="200" x2="140" y2="310" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="175" y="260" font-family="Arial, sans-serif" font-size="8">owns ADC</text>
  <rect x="100" y="410" width="520" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="115" y="432" font-family="Arial, sans-serif" font-size="11" font-weight="bold">216</text>
  <text x="360" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Boot: wait boot_intro_done before load_settings_at_boot()</text>
  <text x="360" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">prevents spurious MIDI notes during settings apply</text>
  <text x="360" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">FIG. 2</text>
</svg>
